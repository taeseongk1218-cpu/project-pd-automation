name: Threads Auto Publish

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "20 8 * * *"
    - cron: "40 10 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 스레드 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads_publish.py

      - name: 발행 결과 커밋
        if: always()
        run: |
          git config user.name "threads-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pairs.json threads_state.json
          git diff --cached --quiet || git commit -m "스레드 발행 결과 기록"
          git pull --rebase origin main
          git push
